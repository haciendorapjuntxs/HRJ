<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRJ | Experiencia Hrj</title>
    <style>
        /* Estilos Globales de Navegación - Actualizados */
        .nav-global { 
            position: fixed; top: 20px; right: 20px; z-index: 9999; 
            display: flex; gap: 20px; background: rgba(0,0,0,0.5); 
            padding: 15px 25px; border: 1px solid #ff4500; border-radius: 50px;
            backdrop-filter: blur(5px);
        }

        .btn-nav {
            font-family: 'Anton', sans-serif; color: #fff; text-decoration: none; 
            font-size: 0.9rem; transition: 0.3s; letter-spacing: 1px;
        }

        .btn-nav:hover { color: #ff4500; }

        /* Responsive: Se ajusta abajo en celulares */
        @media (max-width: 768px) {
            .nav-global { 
                top: auto; bottom: 0; left: 0; right: 0; 
                flex-wrap: wrap; justify-content: center; gap: 10px;
                background: #000; border: none; border-top: 1px solid #ff4500;
                border-radius: 0; padding: 10px;
            }
            .btn-nav { font-size: 0.7rem; }
        }
        
        :root { --naranja: #f37021; --negro: #000; --blanco: #fff; }
        
        body, html {
            margin: 0; padding: 0;
            background-color: var(--negro);
            color: var(--blanco);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .nav-side {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .nav-side a {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: 0.4s;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .nav-side a.active { background: var(--naranja); transform: scale(2); border-color: var(--naranja); }

        .main-wrapper {
            height: 100vh;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }
        
        #main-logo {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1500;
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
            width: 50vw; 
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }
        #main-logo img { width: 100%; height: auto; }
        #main-logo.mini { 
            top: 40px; 
            transform: translate(-50%, 0); 
            width: 150px; 
        }
        
        section { position: relative; min-height: 300vh; scroll-snap-align: start; }
        .sticky-box {
            position: sticky; top: 0; height: 100vh;
            width: 100%; overflow: hidden;
            display: flex; align-items: center;
        }

        .bg-img, .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: brightness(45%);
        }
        
        .content-scroll {
            position: relative; z-index: 10; width: 100%;
            padding: 150vh 10% 100vh 10%;
        }

        .floating-text {
            max-width: 600px;
            margin-bottom: 40vh;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
        }

        .align-right { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
        
        .btn-ghost {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            color: var(--blanco);
            text-decoration: none;
            font-weight: 400;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.5s;
            border: 1px solid rgba(255,255,255,0.4);
            margin-top: 20px;
        }
        .btn-ghost:hover { 
            border-color: var(--naranja); 
            color: var(--naranja);
            background: rgba(243, 112, 33, 0.05);
        }

        h2 { font-size: 5rem; margin: 0; text-transform: uppercase; line-height: 0.8; color: var(--blanco); }
        h2 span { color: var(--naranja); }
        p { font-size: 1.3rem; line-height: 1.4; max-width: 450px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="main-logo"><img src="logo-hrj.png" alt="HRJ Logo"></div>

    <nav class="nav-global">
        <a href="index.html" class="btn-nav">INICIO</a>
        <a href="mapa-territorial.html" class="btn-nav">MAPA</a>
        <a href="biografias.html" class="btn-nav">BIOGRAFÍAS</a>
        <a href="discografia.html" class="btn-nav">DISCOGRAFÍA</a>
        <a href="staff.html" class="btn-nav">STAFF</a>
        <a href="medios.html" class="btn-nav">PRENSA</a>
        <a href="contacto.html" class="btn-nav">CONTACTO</a>
    </nav> 

    <div class="main-wrapper" id="scroll-container">
        <section id="intro">
            <div class="sticky-box">
                <video autoplay muted loop playsinline preload="auto" class="bg-video">
                    <source src="GALERY/prensa-video.mp4" type="video/mp4">
                </video>
                <div class="content-scroll" style="text-align: center;">
                    <a href="#unaj" class="btn-ghost" style="margin-top: 30vh;">Explorar</a>
                </div>
            </div>
        </section>

        </div>

    <script>
        const container = document.getElementById('scroll-container');
        const logo = document.getElementById('main-logo');
        const navLinks = document.querySelectorAll('.nav-side a');

        document.addEventListener('DOMContentLoaded', () => {
            const vids = document.querySelectorAll('video');
            vids.forEach(v => v.play().catch(e => console.log("Auto-play prevenido")));
        });

        container.addEventListener('scroll', () => {
            if (container.scrollTop > window.innerHeight * 0.5) {
                logo.classList.add('mini');
            } else {
                logo.classList.remove('mini');
            }

            let current = "";
            document.querySelectorAll('section').forEach(section => {
                if (container.scrollTop >= section.offsetTop - 500) {
                    current = section.getAttribute('id');
                }
            });

            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href').includes(current)) link.classList.add('active');
            });
        });
    </script>
</body>
</html>
