<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRJ | Medios</title>
    <style>
        /* Estilos Globales de Navegación */
.nav-global { 
    position: fixed; top: 20px; right: 20px; z-index: 9999; 
    display: flex; gap: 10px; background: rgba(0,0,0,0.7); 
    padding: 10px; border: 1px solid #ff4500; border-radius: 5px;
}

.btn-nav {
    font-family: 'Anton', sans-serif; color: #fff; text-decoration: none; 
    font-size: 1rem; padding: 5px 15px; transition: 0.3s;
    border: 1px solid transparent;
}

.btn-nav:hover { color: #ff4500; border-bottom: 1px solid #ff4500; }

/* Responsive: Se ajusta abajo en celulares */
@media (max-width: 768px) {
    .nav-global { 
        top: auto; bottom: 0; left: 0; right: 0; 
        flex-wrap: wrap; justify-content: center; gap: 5px;
        background: #000; border: none; border-top: 1px solid #ff4500;
    }
    .btn-nav { font-size: 0.7rem; padding: 5px; }
}
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700&display=swap');
        
        :root { --naranja: #f37021; --negro: #000; }
        
        body, html { margin: 0; padding: 0; background: var(--negro); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }

       
        #main-title {
            position: fixed; width: 100%; text-align: center; top: 30vh; z-index: 100;
            font-family: 'Anton', sans-serif; font-size: 8rem; color: var(--naranja);
            transition: all 0.5s ease; pointer-events: none;
        }

        .shrink #main-title { top: 20px; font-size: 2rem; }

        
        section { 
            height: 100vh; width: 100%; position: relative; 
            display: flex; align-items: center; justify-content: center;
            background-attachment: fixed; background-size: cover; background-position: center;
        }

        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); 
        }

        .content { 
            position: relative; z-index: 2; width: 80%; max-width: 600px;
            background: rgba(0,0,0,0.8); padding: 40px; border-left: 4px solid var(--naranja);
        }

        h2 { font-family: 'Anton', sans-serif; color: var(--naranja); margin: 0 0 15px; }
        .btn-ver-aca { 
            display: inline-block; padding: 10px 25px; border: 1px solid var(--naranja);
            color: #fff; text-decoration: none; margin-top: 20px; font-weight: bold;
        }
    </style>
</head>
<body>

    <h1 id="main-title">MEDIOS</h1>

    <nav class="nav-global">
    <a href="index.html" class="btn-nav">INICIO</a>
    <a href="mapa-territorial.html" class="btn-nav">MAPA</a>
    <a href="biografias.html" class="btn-nav">BIOGRAFÍAS</a>
    <a href="discografia.html" class="btn-nav">DISCOGRAFÍA</a>
    <a href="staff.html" class="btn-nav">STAFF</a>
    <a href="medios.html" class="btn-nav">PRENSA</a>
    <a href="contacto.html" class="btn-nav">CONTACTO</a>
</nav>

    <div class="main-wrapper" id="contenedor-prensa">
    </div>

<section style="background-image: url('logo-hrj.png');">
    <div class="overlay"></div>
    <div class="content">
        <h2>VOLVE AL INICIO</h2>
        <a href="index.html" class="btn-ver-aca">Inicio</a>
    </div>
</section>
    
        </div>

  <script>
    // 1. Definimos la lista de datos
    const noticias = [
        { titulo: "Desde el Conocimiento", desc: "Un libro de rap y la identidad del conurbano.", link: "https://desdeelconocimiento.com.ar/un-libro-de-rap-y-la-identidad-del-conurbano/", img: "ASSETS-MEDIOS/desde-el-conocimiento.jpg" },
        { titulo: "Página 12", desc: "Pensar el presente de la Provincia. El impacto de Haciendo Rap Juntxs.", link: "https://www.pagina12.com.ar/738332-pensar-el-presente-de-la-provincia", img: "ASSETS-MEDIOS/pagina-12.jpg" },
        { titulo: "Página 12", desc: "El rap como relato del conurbano", link: "https://www.pagina12.com.ar/569517-el-rap-como-relato-del-conurbano/", img: "ASSETS-MEDIOS/pagina-12.jpg" },
        { titulo: "Tiempo Argentino", desc: "Haciendo rap Juntxs, una muestra de confianza en la potencia transformadora de la palabra", link: "https://www.tiempoar.com.ar/ta_article/haciendo-rap-juntxs-una-muestra-de-confianza-en-la-potencia-transformadora-de-la-palabra/", img: "ASSETS-MEDIOS/tiempo-argentino.jpg" },
        { titulo: "Indie Hoy", desc: "4 nuevos libros musicales de autores argentinos", link: "https://indiehoy.com/libros/4-nuevos-libros-musicales-de-autores-argentinos/", img: "ASSETS-MEDIOS/indie-hoy.jpg" },
        { titulo: "Página 12", desc: "Un disco con poesía del conurbano", link: "https://www.pagina12.com.ar/734819-un-disco-con-poesia-del-conurbano/", img: "ASSETS-MEDIOS/pagina-12.jpg" },
        { titulo: "Los Muros", desc: "¨HACIENDO RAP JUNTXS¨", link: "https://losmuros.org/4975/%C2%A8haciendo-rap-juntxs%C2%A8/", img: "ASSETS-MEDIOS/los-muros.jpg" },
        { titulo: "La Colmena Red", desc: "«Haciendo Rap Juntxs» presenta su disco en la UNAJ", link: "https://lacolmenaenred.com.ar/2024/05/02/haciendo-rap-juntxs-presenta-su-disco-en-la-unaj/", img: "ASSETS-MEDIOS/unaj.webp" },
        { titulo: "Cuatro Medios", desc: 'Florencio Varela: presentarán el disco "Haciendo Rap Juntxs" en la UNAJ', link: "https://www.cuatromedios.com.ar/articulo/florencio-varela/florencio-varela-presentaran-disco-haciendo-rap-juntxs-unaj/20240506102700022079.html", img: "ASSETS-MEDIOS/la-colmena.jpg" },
        { titulo: "Conadu", desc: "Haciendo rap juntxs – Conadu es cultura", link: "https://conadu.org.ar/haciendo-rap-juntxs-conadu-es-cultura/", img: "ASSETS-MEDIOS/conadu.jpg" },
        { titulo: "Territorio", desc: "Haciendo rap juntxs: una experiencia de vinculación territorial", link: "https://territorio.unaj.edu.ar/haciendo-rap-juntxs-una-experiencia-de-vinculacion-territorial/", img: "ASSETS-MEDIOS/territorio.jpg" },
        { titulo: "Conadu", desc: "Rap inclusivo en la UNAJ", link: "https://radio.unaj.edu.ar/rap-inclusivo-en-la-unaj/", img: "ASSETS-MEDIOS/rap-inclusivo.jpeg" }
    ];

    // 2. Inyectar noticias (UNA SOLA VEZ)
    const container = document.getElementById('contenedor-prensa');
    noticias.forEach(item => {
        const section = document.createElement('section');
        section.style.backgroundImage = `url('${item.img}')`;
        section.innerHTML = `
            <div class="overlay"></div>
            <div class="content">
                <h2>${item.titulo}</h2>
                <p>${item.desc}</p>
                <a href="${item.link}" target="_blank" class="btn-ver-aca">Ver acá</a>
            </div>
        `;
        container.appendChild(section);
    });

    // 3. Lógica para el Título (Scroll)
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            document.body.classList.add('shrink');
        } else {
            document.body.classList.remove('shrink');
        }
    });
</script>
</body>
</html>
