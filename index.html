<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haciendo Rap Juntxs | UNAJ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="banner-wrapper">
        <div class="logo-area">
            <img src="logounaj.png" alt="Logo UNAJ" class="logo-unaj">
        </div>
        <div class="banner-text">
            <h1>HACIENDO RAP JUNTXS</h1>
            <p>Proyecto de Vinculación Territorial de la Universidad Nacional Arturo Jauretche (UNAJ)</p>
        </div>
        <div class="banner-carousel">
            <div class="banner-slide active" style="background-image: url('HRJ.jpg');"></div>
            <div class="banner-slide" style="background-image: url('HRJ (19).jpg');"></div>
            <div class="banner-slide" style="background-image: url('HRJ (18).jpg');"></div>
        </div>
    </div>

    <main>
        <section class="galeria-grid">
            <div class="imagen-proyecto"><img src="HRJ (10).jpg" alt="Rap UNAJ"></div>
            <div class="imagen-proyecto"><img src="HRJ (11).jpg" alt="Rap UNAJ"></div>
            <div class="imagen-proyecto"><img src="HRJ (12).jpg" alt="Rap UNAJ"></div>
            <div class="imagen-proyecto"><img src="HRJ (13).jpg" alt="Rap UNAJ"></div>
            <div class="imagen-proyecto"><img src="HRJ (14).jpg" alt="Rap UNAJ"></div>
            <div class="imagen-proyecto"><img src="HRJ (15).jpg" alt="Rap UNAJ"></div>
            <div class="imagen-proyecto"><img src="HRJ (16).jpg" alt="Rap UNAJ"></div>
            <div class="imagen-proyecto"><img src="HRJ (17).jpg" alt="Rap UNAJ"></div>
        </section>

        <section class="contenido">
            <div class="columna">
                <h2>NUESTROS OBJETIVOS</h2>
                <p>Promover la expresión cultural, fortalecer la identidad territorial e impulsar la producción discográfica colectiva en el conurbano.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
