<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haciendo Rap Juntxs | UNAJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        :root { --naranja: #ff4500; --negro: #000; }
        
        /* Reset y Scroll Inmersivo */
        body, html { 
            margin: 0; padding: 0; 
            background: var(--negro); 
            color: #fff; 
            font-family: 'Courier Prime', monospace;
            scroll-behavior: smooth;
        }

        .main-wrapper { 
            height: 100vh; 
            overflow-y: auto; 
            scroll-snap-type: y mandatory; 
        }

        /* Navegación Estilo Duki (Impactante) */
        nav {
            position: fixed;
            top: 30px;
            right: 40px;
            z-index: 100;
        }

        .btn-nav-prensa {
            font-family: 'Anton', sans-serif;
            color: #fff;
            text-decoration: none;
            font-size: 1.8rem;
            letter-spacing: 2px;
            border: 2px solid var(--naranja);
            padding: 10px 25px;
            background: rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-nav-prensa:hover {
            background: var(--naranja);
            color: #000;
            letter-spacing: 6px;
            transform: scale(1.1);
        }

        /* Secciones de Pantalla Completa */
        .full-screen-section, .banner-wrapper { 
            height: 100vh; width: 100%; 
            scroll-snap-align: start; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            background-size: cover; 
            background-position: center;
            overflow: hidden;
        }

        /* Cuadros de Información Estilo Callejero */
        .content {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--naranja);
            padding: 40px;
            box-shadow: 15px 15px 0px var(--naranja);
            max-width: 800px;
            text-align: center;
            z-index: 2;
            margin: 20px;
        }

        h1, h2 { font-family: 'Anton', sans-serif; text-transform: uppercase; color: #fff; margin: 0; }
        h1 { font-size: 3.5rem; line-height: 1; }
        
        .btn-ver-aca { 
            display: inline-block; 
            background: var(--naranja); 
            color: #000; 
            padding: 15px 35px; 
            text-decoration: none; 
            font-weight: bold; 
            margin-top: 25px;
            font-family: 'Anton', sans-serif;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-ver-aca:hover { background: #fff; transform: translateY(-5px); }

        /* Carousel y Logos */
        .banner-slide { 
            position: absolute; top:0; left:0; width: 100%; height: 100%; 
            background-size: cover; background-position: center; 
            opacity: 0; transition: opacity 1.5s ease-in-out; 
            z-index: 0; 
        }
        .banner-slide.active { opacity: 1; }

        .logo-header {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 250px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }

        /* Videos Grid */
        .grid-videos { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .grid-videos { grid-template-columns: 1fr; }
            h1 { font-size: 2.2rem; }
            nav { top: 20px; right: 20px; }
            .btn-nav-prensa { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<nav>

</main>

<script>
    // Sistema de Carrusel Suave
    let slides = document.querySelectorAll('.banner-slide');
    let currentSlide = 0;

    function nextSlide() {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }

    setInterval(nextSlide, 6000);
</script>
