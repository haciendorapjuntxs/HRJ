<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haciendo Rap Juntxs | UNAJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        :root { --naranja: #ff4500; --negro: #000; }
        body, html { margin: 0; padding: 0; background: var(--negro); color: #fff; font-family: 'Courier Prime', monospace; }

        
        .main-wrapper { height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; }
        .full-screen-section { 
            height: 100vh; width: 100%; scroll-snap-align: start; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; background-size: cover; background-position: center;
        }

       
        .content {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid var(--naranja);
            padding: 40px;
            box-shadow: 10px 10px 0px var(--naranja);
            max-width: 700px;
            text-align: center;
            z-index: 2;
        }

        h1, h2 { font-family: 'Anton', sans-serif; text-transform: uppercase; color: #fff; }
        .btn-ver-aca { 
            display: inline-block; background: var(--naranja); color: #000; 
            padding: 15px 30px; text-decoration: none; font-weight: bold; margin-top: 20px;
        }

        .banner-wrapper { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; }
        .banner-slide { position: absolute; top:0; left:0; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 0; }
    </style>
</head>
<body>

<main class="main-wrapper">
    <section class="banner-wrapper">
        <div class="banner-carousel">
            <div class="banner-slide" style="background-image: url('GALERY/portada_hrj.jpg');"></div>
            </div>
        <div style="position: absolute; top: 20px; width: 100%; z-index: 10; text-align: center;">
            <img src="logo-hrj.png" width="200">
            <ul style="list-style: none; display: flex; justify-content: center; gap: 20px;">
                <li><a href="medios.html" style="color: #fff; text-decoration: none;">PRENSA</a></li>
            </ul>
        </div>
    </section>

    <section class="full-screen-section" style="background-image: url('GALERY/hrj-2.jpg');">
        <div class="content">
            <h1>HACIENDO RAP JUNTXS</h1>
            <p>Donde la calle y la academia se encuentran.</p>
            <a href="medios.html" class="btn-ver-aca">VER TODAS LAS NOTAS</a>
        </div>
    </section>

    <section class="full-screen-section" style="background-image: url('GALERY/hrj-3.jpg');">
        <div class="content">
            <h2>LO QUE YA ESTÁ PASANDO</h2>
            <p>Libro antología y colectivo territorial de la UNAJ.</p>
            <a href="https://editleviatan.wordpress.com/2023/05/10/haciendo-rap-juntxs/" class="btn-ver-aca">VER MÁS</a>
        </div>
    </section>

    <section class="full-screen-section" style="background: var(--negro);">
        <div class="content">
            <h2>RÍMAS EN VIDEO</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <iframe src="https://www.youtube.com/embed/Nt9W1jBXWFo" height="150" width="100%"></iframe>
                <iframe src="https://www.youtube.com/embed/9YYNLzb9i-g" height="150" width="100%"></iframe>
                <iframe src="https://www.youtube.com/watch?v=MpYa0bPlMHA" height="150" width="100%"></iframe>
                <iframe src="https://www.youtube.com/watch?v=WQKzsCVjRM4" height="150" width="100%"></iframe>
                <iframe src="https://www.youtube.com/watch?v=TGmSBw9QE9k&pp=0gcJCd4KAYcqIYzv" height="150" width="100%"></iframe>
            </div>
        </div>
    </section>
</main>

<script>
   
    let slides = document.querySelectorAll('.banner-slide');
    let i = 0;
    setInterval(() => {
        slides[i].style.opacity = 0;
        i = (i + 1) % slides.length;
        slides[i].style.opacity = 1;
    }, 4000);
</script>

</body>
</html>
