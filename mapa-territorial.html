    <div class="agenda-promo">
    <p>¿Tenés un evento? <a href="https://docs.google.com/forms/d/e/1FAIpQLSc8kjFM9Pg1SqjkHXsJjLA_eF_4itxfDL4_josRkLXTc_RhGQ/viewform?usp=sharing&ouid=112545650355580882446" target="_blank">Subilo a la Agenda Territorial</a></p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    var map = L.map('map').setView([-34.75, -58.55], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.control.locate().addTo(map);

    var unajCoords = [-34.7751535, -58.2678955]; 
    
    var unajMarker = L.marker(unajCoords, {
        title: "UNAJ - Av. Calchaquí 6200"
    }).addTo(map);
    
    unajMarker.bindPopup("<b>UNAJ - Sede Central</b><br>Av. Calchaquí 6200, Florencio Varela");

    var layerLazos = L.layerGroup().addTo(map);

    fetch('artistas.json')
        .then(res => res.json())
        .then(artistas => {
            var markersCluster = L.markerClusterGroup();
            
            artistas.forEach(a => {
                var marker = L.marker([a.lat, a.lng], {title: a.nombre});
                marker.bindTooltip(a.barrio, {permanent: true, className: 'custom-tooltip'});
                marker.bindPopup(`<div class="marker-text">${a.nombre}<br><a href="${a.url}"><img src="${a.img}" class="popup-img"></a></div>`);
                
                marker.on('click', function() {
                    layerLazos.clearLayers(); 
                    L.polyline([unajCoords, [a.lat, a.lng]], {
                        color: '#ff4500',
                        weight: 4,
                        opacity: 0.7,
                        dashArray: '10, 10'
                    }).addTo(layerLazos);
                });

                markersCluster.addLayer(marker);
            });
            
            map.addLayer(markersCluster);
            map.addControl(new L.Control.Search({layer: markersCluster, propertyName: 'title', marker: false}));
        });


    // --- LÓGICA DE AGENDA (VERSIÓN ROBUSTA) ---
const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRDb66cxjNWqp62AMf2HvWlBndeut6aXVi_cRhqKDO5Xp6DnZFtmWA2ubKoR0PITD2ydDxRz-VMmi9o/pub?gid=2141097724&single=true&output=csv';

fetch(urlCSV)
    .then(res => res.text())
    .then(csvText => {
        const filas = csvText.split('\n').slice(1);
        
        // Obtenemos la fecha de hoy y la normalizamos a medianoche para comparar
        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);

        filas.forEach((fila, index) => {
            const c = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
            
            if (c.length < 11) return; // Saltea filas vacías

            const nombre = c[2] ? c[2].replace(/"/g, "") : "Evento sin nombre";
            const fechaRaw = c[6] ? c[6].trim() : ""; // El formato será DD/MM/AAAA
            const lat = parseFloat(c[9]);
            const lng = parseFloat(c[10]);
            const estado = c[11] ? c[11].trim().toUpperCase() : "";

            // Convertimos la fecha del Excel (DD/MM/AAAA) a un objeto de fecha real
            const partes = fechaRaw.split('/');
            const fechaEvento = new Date(partes[2], partes[1] - 1, partes[0]);

            // DEBUG: Esto es para vos. Si apretás F12 en tu web, verás esto:
            console.log(`Fila ${index + 1}: ${nombre} | Estado: ${estado} | Fecha: ${fechaRaw} | Lat: ${lat}`);

            // REGLA: Estado OK, Fecha hoy o futura, y que la Latitud sea un número válido
            if (estado === "OK" && fechaEvento >= hoy && !isNaN(lat)) {
                
                var markerEvento = L.circleMarker([lat, lng], {
                    radius: 12,
                    fillColor: "#ff4500",
                    color: "#ffffff",
                    weight: 3,
                    fillOpacity: 0.9
                }).addTo(map);

                markerEvento.bindPopup(`
                    <div style="background:#ff4500; color:white; padding:5px; font-family:'Anton'; text-align:center;">AGENDA HRJ</div>
                    <div style="text-align:center; font-family:'Courier Prime'; padding:10px;">
                        <strong>${nombre}</strong><br>
                        <span style="color:#666;">📅 ${fechaRaw}</span><br><br>
                        <a href="${c[8]}" target="_blank" style="background:#000; color:#fff; padding:5px 10px; text-decoration:none; border-radius:3px; font-size:12px;">VER MÁS INFO</a>
                    </div>
                `);
            }
        });
    })
    .catch(err => console.error("Error en la conexión con la planilla:", err));
    
</script> 
    
</body>
