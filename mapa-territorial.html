<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="https://hrj.com.ar/logo-hrj.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Mapa Territorial | Haciendo Rap Juntxs</title>
    <meta name="description" content="Explorá el mapa territorial de Haciendo Rap Juntxs: el punto de encuentro entre el rap, los barrios del conurbano y la Universidad Nacional Arturo Jauretche.">
    <meta name="keywords" content="Haciendo Rap Juntxs, mapa, rap, conurbano, UNAJ, territorio, cultura">
    
    <meta property="og:title" content="Mapa Territorial | Haciendo Rap Juntxs">
    <meta property="og:description" content="Un recorrido visual por las voces del conurbano. Explorá el mapa de artistas y sedes de Haciendo Rap Juntxs.">
    <meta property="og:image" content="https://hrj.com.ar/logo-hrj.png">
    <meta property="og:url" content="https://hrj.com.ar/mapa-territorial.html">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <style>
        /* --- RESET GLOBAL --- */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; }

        :root { --naranja: #ff4500; --negro: #000; }

        /* Contenedor principal de navegación */
        nav {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid var(--naranja);
            border-radius: 5px;
        }

        .btn-nav {
            font-family: 'Anton', sans-serif;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            padding: 5px 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .btn-nav:hover {
            color: var(--negro);
            background-color: var(--naranja);
            border-color: var(--naranja);
        }

        /* Mapa a pantalla completa */
        #map { 
            height: 100vh; 
            width: 100vw; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1;
        }

        .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(80%) contrast(100%); }
        
        .popup-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--naranja); }
        .marker-text { color: var(--naranja); font-weight: bold; text-align: center; font-family: 'Anton', sans-serif; }
        .custom-tooltip { background: rgba(0,0,0,0.8) !important; color: var(--naranja) !important; border: 1px solid var(--naranja) !important; font-family: 'Anton', sans-serif; }

        /* --- ADAPTACIÓN RESPONSIVA (Celulares) --- */
        @media (max-width: 768px) {
            nav {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 2px;
                border-top: 2px solid var(--naranja);
                background: #000;
                border-radius: 0;
                padding: 5px;
            }
            .btn-nav {
                font-size: 0.65rem;
                padding: 10px 2px;
                text-align: center;
                border: 1px solid var(--naranja);
            }
            #map { height: 100vh; width: 100vw; }
        } 
    </style>
</head>
<body>

<nav class="nav-global">
    <a href="index.html" class="btn-nav">INICIO</a>
    <a href="biografias.html" class="btn-nav">BIOGRAFÍAS</a>
    <a href="discografia.html" class="btn-nav">DISCOGRAFÍA</a>
    <a href="staff.html" class="btn-nav">STAFF</a>
    <a href="medios.html" class="btn-nav">PRENSA</a>
    <a href="contacto.html" class="btn-nav">CONTACTO</a>
</nav>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    var map = L.map('map').setView([-34.75, -58.55], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.control.locate().addTo(map);

    var unajCoords = [-34.7751535, -58.2678955]; 
    
    var unajMarker = L.marker(unajCoords, {
        title: "UNAJ - Av. Calchaquí 6200"
    }).addTo(map);
    
    unajMarker.bindPopup("<b>UNAJ - Sede Central</b><br>Av. Calchaquí 6200, Florencio Varela");

    var layerLazos = L.layerGroup().addTo(map);

    fetch('artistas.json')
        .then(res => res.json())
        .then(artistas => {
            var markersCluster = L.markerClusterGroup();
            
            artistas.forEach(a => {
                var marker = L.marker([a.lat, a.lng], {title: a.nombre});
                marker.bindTooltip(a.barrio, {permanent: true, className: 'custom-tooltip'});
                marker.bindPopup(`<div class="marker-text">${a.nombre}<br><a href="${a.url}"><img src="${a.img}" class="popup-img"></a></div>`);
                
                marker.on('click', function() {
                    layerLazos.clearLayers(); 
                    L.polyline([unajCoords, [a.lat, a.lng]], {
                        color: '#ff4500',
                        weight: 4,
                        opacity: 0.7,
                        dashArray: '10, 10'
                    }).addTo(layerLazos);
                });

                markersCluster.addLayer(marker);
            });
            
            map.addLayer(markersCluster);
            map.addControl(new L.Control.Search({layer: markersCluster, propertyName: 'title', marker: false}));
        });
</script> 
    
</body>
</html>
