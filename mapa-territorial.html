<script>
var unajCoords = [-34.7751535, -58.2678955]; 
var map = L.map('map', {zoomControl: false}).setView(unajCoords, 11);

L.control.zoom({ position: 'topleft' }).addTo(map);
L.control.locate({ position: 'topleft' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    subdomains: 'abcd',

}).addTo(map);

const grupoClustering = L.markerClusterGroup({
    spiderfyOnMaxZoom: true, 
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true
});
map.addLayer(grupoClustering); 

var unajMarker = L.marker(unajCoords, {title: "UNAJ"}).addTo(map);
unajMarker.bindPopup("<b style='font-family: Anton; color:#ff4500;'>UNAJ - Sede Central</b><br><span style='font-family: Courier Prime;'>Florencio Varela</span>");

var layerLazos = L.layerGroup().addTo(map);

var artistaIcono = L.icon({
    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41],
    className: 'artista-marker-icon'
});

// =========================================================================
// MOTOR DE ARTISTAS
// =========================================================================
fetch('artistas.json')
    .then(res => res.json())
    .then(artistas => {
        var markersCluster = L.markerClusterGroup();
        artistas.forEach(a => {
            var marker = L.marker([a.lat, a.lng], {title: a.nombre, icon: artistaIcono});
            marker.bindTooltip(a.barrio, {permanent: true, className: 'custom-tooltip'});
            marker.bindPopup(`<div class="marker-text">${a.nombre}<br><a href="${a.url}"><img src="${a.img}" class="popup-img" onerror="this.src='https://hrj.com.ar/logo-hrj.png'"></a></div>`);
            
            marker.on('click', function() {
                layerLazos.clearLayers(); 
                L.polyline([unajCoords, [a.lat, a.lng]], {

        });
        map.addLayer(markersCluster);
        map.addControl(new L.Control.Search({layer: markersCluster, propertyName: 'title', marker: false}));
    }).catch(err => console.error("Error al cargar artistas.json:", err));

// =========================================================================
// MOTOR DE AGENDA ROBUSTO 
// =========================================================================
const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRDb66cxjNWqp62AMf2HvWlBndeut6aXVi_cRhqKDO5Xp6DnZFtmWA2ubKoR0PITD2ydDxRz-VMmi9o/pub?gid=2141097724&single=true&output=csv&cb=' + new Date().getTime();
const urlHistoricoCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRQ0u1VMMDvmJoLzbMXe7as01c2QPPNyFXaB_KRGSAZOxpDBVWAkMD_fHsIOSmO2AvWaoJ57gGIbFzM/pub?output=csv&cb=' + new Date().getTime();

const capaPasados = L.layerGroup(); 


function parsearCSVCompleto(textoCompleto) {
    let lineas = [];
    let lineaActual = [''];
    let dentroComillas = false;
    let c = 0;
    
    let primeraLinea = textoCompleto.split('\n')[0];
    let separador = (primeraLinea.split(';').length > primeraLinea.split(',').length) ? ';' : ',';

    for (let i = 0; i < textoCompleto.length; i++) {
        let ch = textoCompleto[i];
        let siguiente = textoCompleto[i+1];

        if (ch === '"') {
            if (dentroComillas && siguiente === '"') { 
                lineaActual[c] += '"'; i++; 
            } else { 
                dentroComillas = !dentroComillas; 
            }
        } else if (ch === separador && !dentroComillas) {
            lineaActual[++c] = '';
        } else if ((ch === '\r' || ch === '\n') && !dentroComillas) {
            if (ch === '\r' && siguiente === '\n') { i++; }
            if (lineaActual.length > 1 || lineaActual[0] !== '') {
                lineas.push(lineaActual);
            }
            lineaActual = [''];
            c = 0;
        } else {
            lineaActual[c] += ch;
        }
    }
    if (lineaActual.length > 1 || lineaActual[0] !== '') {
        lineas.push(lineaActual);
    }
    return lineas;
}

function procesarHojaCSV(url, esCapaHistoricaFija) {
    fetch(url)
        .then(res => res.text())
        .then(csvText => {
            const matriz = parsearCSVCompleto(csvText);
            if (matriz.length < 2) return;

            // Escaneo ultra-flexible de cabeceras limpiando espacios y mayúsculas
            const cabecera = matriz[0].map(h => h.toUpperCase().replace(/\s+/g, '').trim());
            
            let idxNombre = cabecera.findIndex(h => h.includes("NOMBRE"));
            let idxFlyer = cabecera.findIndex(h => h.includes("FLYER")); 
            let idxFecha = cabecera.findIndex(h => h.includes("FECHA"));
            let idxLink = cabecera.findIndex(h => h.includes("LINK"));
            let idxLat = cabecera.findIndex(h => h.includes("LATITUD"));
            let idxLng = cabecera.findIndex(h => h.includes("LONGITUD"));
            let idxEstado = cabecera.findIndex(h => h.includes("ESTADO"));

            if (idxNombre === -1) idxNombre = 1;
            if (idxFlyer === -1) idxFlyer = 2; 
            if (idxFecha === -1) idxFecha = 5; 
            if (idxLink === -1) idxLink = 6;
            if (idxLat === -1) idxLat = 8;
            if (idxLng === -1) idxLng = 9;
            if (idxEstado === -1) idxEstado = 10;

            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0); 

            for (let i = 1; i < matriz.length; i++) {
                const c = matriz[i];
                if (!c || c.length < 3) continue; 

                let latRaw = c[idxLat];
                let lngRaw = c[idxLng];

                if (esCapaHistoricaFija && (isNaN(parseFloat(latRaw)) || isNaN(parseFloat(lngRaw)))) {
                    for (let k = 0; k < c.length; k++) {
                        if (c[k] && c[k].includes('-34.')) latRaw = c[k];
                        if (c[k] && (c[k].includes('-58.') || c[k].includes('-57.'))) lngRaw = c[k];
                    }
                }

                const lat = parseFloat(latRaw?.replace(/[ "]/g, "").replace(',', '.'));
                const lng = parseFloat(lngRaw?.replace(/[ "]/g, "").replace(',', '.'));
                if (isNaN(lat) || isNaN(lng)) continue;

                const estado = c[idxEstado] ? c[idxEstado].toUpperCase().trim() : (esCapaHistoricaFija ? "OK" : "");
                if (!esCapaHistoricaFija && !estado.includes("OK")) continue;

                const nombre = c[idxNombre] ? c[idxNombre].trim() : "Evento";
                
                // AQUÍ LA CLAVE: Limpieza absoluta de comillas y saltos de línea fantasmas (\r o \n)
                const datoFlyer = c[idxFlyer] ? c[idxFlyer].replace(/[\r\n"']/g, "").trim() : "";
                const fechaTxt = c[idxFecha]?.trim() || ""; 
                const linkFB = c[idxLink] ? c[idxLink].trim() : "#";

                const partes = fechaTxt.split(/[-/]/); 
                if (partes.length !== 3) continue;

                let dia, mes, anio;
                if (partes[0].length === 4) { 
                    anio = partes[0]; mes = partes[1].padStart(2, '0'); dia = partes[2].padStart(2, '0');
                } else { 
                    dia = partes[0].padStart(2, '0'); mes = partes[1].padStart(2, '0'); anio = partes[2];
                }

                let fEv = new Date(`${anio}-${mes}-${dia}T23:59:59`);
                if (isNaN(fEv.getTime())) continue; 

                const esPasado = esCapaHistoricaFija ? true : (hoy > fEv);
                const colorTema = esPasado ? '#888' : '#1fd655';

                let urlFinalImg = "https://hrj.com.ar/logo-hrj.png";
                
                if (datoFlyer.length > 3) {
                    if (datoFlyer.includes('drive.google.com') || datoFlyer.includes('id=')) {
                        // Resuelve imágenes de Google Drive
                        let idImg = "";
                        if (datoFlyer.includes('id=')) {
                            idImg = datoFlyer.split('id=')[1].split('&')[0].trim();
                        } else if (datoFlyer.includes('/d/')) {
                            idImg = datoFlyer.split('/d/')[1].split('/')[0].trim();
                        }
                        if (idImg) {
                            urlFinalImg = `https://drive.google.com/thumbnail?sz=w500&id=${idImg}`;
                        }
                    } else {
                        // Resuelve archivos locales de la carpeta flyer-territorial (Ej: archivo-historico-del-hip-hop.jpg)
                        const nombreArchivoLimpio = datoFlyer.replace(/\s+/g, '');
                        urlFinalImg = (nombreArchivoLimpio.includes('/') || nombreArchivoLimpio.startsWith('http')) ? 
                                      nombreArchivoLimpio : `https://hrj.com.ar/flyer-territorial/${nombreArchivoLimpio}`;
                    }
                }

                const marcador = L.marker([lat, lng], {
                    icon: L.divIcon({ 
                        className: esPasado ? 'pulse-past' : 'pulse-green', 
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    })
                }).bindPopup(`
                    <div style="text-align: center; font-family: 'Anton', sans-serif; width: 220px; background: #111; color: #fff; padding: 10px; border-radius: 8px; border: 1px solid ${colorTema};">
                        <div style="overflow: hidden; border-radius: 4px; margin-bottom: 8px; background: #000; filter: ${esPasado ? 'grayscale(1)' : 'none'}; -webkit-filter: ${esPasado ? 'grayscale(1)' : 'none'};">
                            <img src="${urlFinalImg}" style="width: 100%; display: block; object-fit: cover; min-height: 120px; max-height: 200px;" onerror="this.src='https://hrj.com.ar/logo-hrj.png'">
                        </div>
                        <h3 style="margin: 5px 0; font-size: 16px; text-transform: uppercase; color:#fff;">${nombre}</h3>
                        <p style="font-family: 'Courier Prime'; font-size: 12px; color: ${colorTema}; margin: 5px 0 10px 0;">📅 ${fechaTxt}</p>
                        <a href="${linkFB}" target="_blank" style="display: block; background: ${colorTema}; color: #000; padding: 8px; text-decoration: none; font-weight: bold; border-radius: 4px; font-size: 11px; text-transform: uppercase;">MÁS INFO</a>
                    </div>
                `, { maxWidth: 250 });

                if (esPasado) {
                    marcador.addTo(grupoClustering); 
                    capaPasados.addLayer(marcador); 
                } else {
                    marcador.addTo(grupoClustering);
                } 
            }
        }).catch(err => console.error("Error procesando CSV:", url, err));
} 

procesarHojaCSV(urlCSV, false);
procesarHojaCSV(urlHistoricoCSV, true);



    
function toggleEventosPasados(e) {
    e.preventDefault();
    const btn = document.getElementById('toggle-pasados'); 
    if (grupoClustering.hasLayer(capaPasados.getLayers()[0])) {    
        capaPasados.eachLayer(layer => grupoClustering.removeLayer(layer));
        btn.innerText = "HISTORIAL";
        btn.classList.remove('activo');
    } else {
        capaPasados.eachLayer(layer => grupoClustering.addLayer(layer));       
        btn.innerText = "OCULTAR PASADOS";
        btn.classList.add('activo');
    }
}

// =========================================================================
// MOTOR DE ESTUDIOS
// =========================================================================
const capaEstudios = L.layerGroup().addTo(map); 

fetch('estudios.geojson')
    .then(res => res.json())
    .then(data => {
        const mainstream = ["DISNEY", "TELEFE", "CANAL", "MITRE", "ESTUDIOS MAYOR", "AMERICA TV", "C5N"];
        data.features.forEach(f => {
            let coords;
            if (f.geometry.type === 'Polygon') {
                const lats = f.geometry.coordinates[0].map(c => c[1]);
                const lngs = f.geometry.coordinates[0].map(c => c[0]);
                coords = [(Math.min(...lats) + Math.max(...lats)) / 2, (Math.min(...lngs) + Math.max(...lngs)) / 2];
            } else {
                coords = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
            }
            
            const nombreOriginal = f.properties.name || f.properties.col1 || f.properties.Nombre || "Estudio";
            const nombre = nombreOriginal.toUpperCase();
            
            if (!mainstream.some(p => nombre.includes(p)) && coords[0] < -34.35 && coords[0] > -35.05) {
                L.circleMarker(coords, { radius: 5, fillColor: '#ff0000', color: '#fff', weight: 1, fillOpacity: 0.8 })
                .bindPopup(`<div style="font-family:'Anton'; text-align:center; font-size:12px; color:#ff0000;">🎙️ ${nombre}</div>`)
                .addTo(capaEstudios); 
            }
        });
    }); 

function toggleEstudios(e) {
    e.preventDefault();
    const btn = document.getElementById('toggle-estudios');
    const itemIndice = document.getElementById('item-indice-estudios');
    if (map.hasLayer(capaEstudios)) {
        map.removeLayer(capaEstudios);
        btn.innerText = "ESTUDIOS";
        btn.classList.remove('activo');
        if(itemIndice) itemIndice.style.opacity = '0.3';
    } else {
        map.addLayer(capaEstudios);
        btn.innerText = "OCULTAR ESTUDIOS";
        btn.classList.add('activo');
        if(itemIndice) itemIndice.style.opacity = '1';
    }
}

// =========================================================================
// MOTOR DE CULTURA
// =========================================================================
const capaCultura = L.layerGroup().addTo(map);

fetch('cultura.geojson')
    .then(res => res.json())
    .then(data => {
        data.features.forEach(f => {
            if (!f.geometry || !f.geometry.coordinates) return;
            
            let lon = f.geometry.coordinates[0];
            let lat = f.geometry.coordinates[1];
            
            if (lat > 0 && lon < 0) { 
                let temp = lat; lat = lon; lon = temp; 
            }

            const p = f.properties || {};
            const nombreSpace = p.name || p.NAME || p.nombre || p.NOMBRE || "Espacio Cultural";
            const domicilio = p.domicilio || p.DOMICILIO || p.direccion || p.DIRECCION || 'Sin Dirección';
            const localidad = p.localidad || p.LOCALIDAD || "";
            const provincia = p.provincia || p.PROVINCIA || "";

            const colorMarcador = "#9b59b6";
            const tipoLimpio = "Subsecretaría de Cultura";
            
            L.circleMarker([lat, lon], {
                radius: 6,
                fillColor: colorMarcador,
                color: '#fff',
                weight: 1.5,
                fillOpacity: 0.85
            }).bindPopup(`
                <div style="font-family: 'Anton', sans-serif; text-align: center; background: #111; color: #fff; padding: 5px; border-radius: 5px; border: 1px solid ${colorMarcador};">
                    <h4 style="margin: 5px 0; font-size: 14px; color: ${colorMarcador}; text-transform: uppercase;">${nombreSpace}</h4>
                    <p style="font-family: 'Courier Prime'; font-size: 11px; margin: 5px 0; color: #aaa;">📍 ${domicilio}<br>${localidad} ${provincia ? '('+provincia+')' : ''}</p>
                    <span style="font-size: 10px; background: ${colorMarcador}; color: #000; padding: 2px 6px; border-radius: 3px; font-weight: bold; display: inline-block; margin-top: 5px;">${tipoLimpio}</span>
                </div>
            `, { maxWidth: 220 }).addTo(capaCultura);
        });
    }).catch(err => console.error("Error al cargar cultura.geojson:", err));

function toggleCultura(e) {
    e.preventDefault();
    const btn = document.getElementById('toggle-cultura');
    const itemsCultura = document.querySelectorAll('.item-cultura-leyenda');
    
    if (map.hasLayer(capaCultura)) {
        map.removeLayer(capaCultura);
        btn.innerText = "CULTURA";
        btn.classList.remove('activo');
        itemsCultura.forEach(item => item.style.opacity = '0.3');
    } else {
        map.addLayer(capaCultura);
        btn.innerText = "OCULTAR CULTURA";
        btn.classList.add('activo');
        itemsCultura.forEach(item => item.style.opacity = '1');
    }
}

// =========================================================================
// ÍNDICE DE COLORES (LEYENDA DINÁMICA CON POSICIONAMIENTO SMARTPHONE)

        <div id="item-indice-unaj" style="display: flex; align-items: center; margin-bottom: 6px;">
            <img src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" style="width: 9px; height: 15px; margin-right: 11px; margin-left: 2px;">
            <span>Sede Central UNAJ</span>
        </div>

        <div id="item-indice-artistas" style="display: flex; align-items: center; margin-bottom: 6px;">

        </div>

        <div style="display: flex; align-items: center; margin-bottom: 6px;">
            <span style="display: inline-block; width: 12px; height: 12px; background: var(--verde-agenda); border-radius: 50%; margin-right: 8px; border: 1px solid #fff; box-shadow: 0 0 6px var(--verde-agenda);"></span>
            <span>Evento Actual (Verde)</span>
        </div>
        
        <div style="display: flex; align-items: center; margin-bottom: 6px;">
            <span style="display: inline-block; width: 12px; height: 12px; background: #555; border-radius: 50%; margin-right: 8px; border: 1px solid #888;"></span>
            <span style="color: #aaa;">Evento Pasado (B&N)</span>
        </div>
        
        <div id="item-indice-estudios" style="display: flex; align-items: center; margin-bottom: 6px; transition: opacity 0.3s;">

        <div class="item-cultura-leyenda" style="display: flex; align-items: center; transition: opacity 0.3s;">

leyenda.addTo(map);
</script>
