    <style>

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; }

        :root { --naranja: #ff4500; --negro: #000; }

        /* Contenedor principal de navegación */
        nav {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid var(--naranja);
            border-radius: 5px;
        }

        .btn-nav {
            font-family: 'Anton', sans-serif;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            padding: 5px 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .btn-nav:hover {
            color: var(--negro);
            background-color: var(--naranja);
            border-color: var(--naranja);
        }

        /* Mapa a pantalla completa */
        #map { 
            height: 100vh; 
            width: 100vw; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1;
        }

        .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(80%) contrast(100%); }
        
        .popup-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--naranja); }
        .marker-text { color: var(--naranja); font-weight: bold; text-align: center; font-family: 'Anton', sans-serif; }
        .custom-tooltip { background: rgba(0,0,0,0.8) !important; color: var(--naranja) !important; border: 1px solid var(--naranja) !important; font-family: 'Anton', sans-serif; }

        @media (max-width: 768px) {

        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        /* flex con wrap para que se acomoden solos */
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
        border-top: 2px solid var(--naranja);
        background: #000;
        border-radius: 0;
        padding: 5px;
        box-sizing: border-box; /* no se desborda */
    }
    .btn-nav {
        font-size: 0.6rem;
        padding: 8px 4px;
        flex: 1 1 30%; /* 3 por fila */

        border: 1px solid var(--naranja);
        white-space: nowrap;

} 



       /* Botón de la Agenda */
.agenda-promo {
    position: fixed;
    bottom: 80px; /* Arriba del nav de celular */
    left: 50%;
    transform: translateX(-50%);
    z-index: 10000;
    background: #1fd655;
    padding: 10px 20px;
    border-radius: 50px;
    font-family: 'Anton', sans-serif;

    border: 2px solid #fff;
}
.agenda-promo p { margin: 0; font-size: 14px; color: #000; }
.agenda-promo a { color: #000; text-decoration: underline; }

/* El Punto Verde estilo Instagram */
.pulse-green {
    background: #1fd655;
    border-radius: 50%;
    border: 2px solid white;
    animation: pulse-green-animation 2s infinite;
}
@keyframes pulse-green-animation {
    0% { box-shadow: 0 0 0 0 rgba(31, 214, 85, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(31, 214, 85, 0); }
    100% { box-shadow: 0 0 0 0 rgba(31, 214, 85, 0); }
} 


        
    </style>

<body>

<nav>
    <a href="index.html" class="btn-nav">INICIO</a>
    <a href="biografias.html" class="btn-nav">BIOGRAFÍAS</a>

    <a href="medios.html" class="btn-nav">PRENSA</a>
    <a href="contacto.html" class="btn-nav">CONTACTO</a>
    <div class="agenda-promo">
    <p>¿Tenés un evento? <a href="https://docs.google.com/forms/d/e/1FAIpQLSc8kjFM9Pg1SqjkHXsJjLA_eF_4itxfDL4_josRkLXTc_RhGQ/viewform?usp=sharing&ouid=112545650355580882446" target="_blank">Subilo a la Agenda Territorial</a></p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    var map = L.map('map').setView([-34.75, -58.55], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.control.locate().addTo(map);

    var unajCoords = [-34.7751535, -58.2678955]; 
    var unajMarker = L.marker(unajCoords, {title: "UNAJ - Av. Calchaquí 6200"}).addTo(map);
    unajMarker.bindPopup("<b>UNAJ - Sede Central</b><br>Av. Calchaquí 6200, Florencio Varela");

    var layerLazos = L.layerGroup().addTo(map);

    fetch('artistas.json')
        .then(res => res.json())
        .then(artistas => {
            var markersCluster = L.markerClusterGroup();
            artistas.forEach(a => {
                var marker = L.marker([a.lat, a.lng], {title: a.nombre});
                marker.bindTooltip(a.barrio, {permanent: true, className: 'custom-tooltip'});
                marker.bindPopup(`<div class="marker-text">${a.nombre}<br><a href="${a.url}"><img src="${a.img}" class="popup-img"></a></div>`);
                marker.on('click', function() {
                    layerLazos.clearLayers(); 
                    L.polyline([unajCoords, [a.lat, a.lng]], {
                        color: '#ff4500', weight: 4, opacity: 0.7, dashArray: '10, 10'
                    }).addTo(layerLazos);
                });
                markersCluster.addLayer(marker);
            });
            map.addLayer(markersCluster);
            map.addControl(new L.Control.Search({layer: markersCluster, propertyName: 'title', marker: false}));
        });

// --- MOTOR DE AGENDA TERRITORIAL (CORRECCIÓN FINAL) ---
const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRDb66cxjNWqp62AMf2HvWlBndeut6aXVi_cRhqKDO5Xp6DnZFtmWA2ubKoR0PITD2ydDxRz-VMmi9o/pub?gid=2141097724&single=true&output=csv';

fetch(urlCSV)
    .then(res => res.text())
    .then(csvText => {
        const lineas = csvText.split('\n');

        for (let i = 1; i < lineas.length; i++) {
            const c = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
            if (c.length < 11) continue;

            // Limpieza de datos (Nombre, Fecha, Link)
            const nombre = c[2] ? c[2].replace(/"/g, "").trim() : "EVENTO HRJ";
            const fechaRaw = c[6] ? c[6].replace(/"/g, "").trim() : "Fecha a confirmar"; 
            const linkOriginal = c[8] ? c[8].replace(/"/g, "").trim() : "";
            
            // Extractor de ID de Drive (Corregido: ahora usa ${} correctamente)
            let linkFoto = "";
            if (linkOriginal.includes("drive.google.com")) {
                const match = linkOriginal.match(/[-\w]{25,}/); 
                if (match) {
                    // Este link es el que mejor funciona para embeber fotos de Drive
                    linkFoto = `https://lh3.googleusercontent.com/u/0/d/${match[0]}`;
                }
            }

            const lat = parseFloat(c[9].replace(/[ "]/g, "").replace(',', '.'));
            const lng = parseFloat(c[10].replace(/[ "]/g, "").replace(',', '.'));
            const estado = c[11] ? c[11].replace(/"/g, "").trim().toUpperCase() : "";

            if (estado === "OK" && !isNaN(lat)) {
                L.marker([lat, lng], {
                    icon: L.divIcon({ 
                        className: 'pulse-green', 
                        iconSize: [22, 22], 
                        iconAnchor: [11, 11] 
                    })
                }).addTo(map).bindPopup(`
                    <div style="text-align:center; font-family:'Anton', sans-serif; width:250px; color:#000; padding:5px;">
                        <div style="background:#1fd655; color:#000; padding:8px; font-size:14px; margin-bottom:12px; border-radius:4px;">AGENDA TERRITORIAL</div>
                        
                        <h2 style="font-size:20px; margin:0 0 8px 0; text-transform:uppercase; line-height:1.1; color:#000;">${nombre}</h2>
                        
                        <div style="font-family:'Courier Prime', monospace; font-size:14px; margin-bottom:15px; background:#e8e8e8; padding:5px 10px; border-radius:4px; display:inline-block; border:1px solid #ccc;">
                            📅 ${fechaRaw}
                        </div>
                        
                        <div style="margin-bottom:12px; background:#f9f9f9; border-radius:8px; overflow:hidden; border:2px solid #1fd655; min-height:120px; display:flex; align-items:center; justify-content:center;">
                            ${linkFoto ? 
                                `<img src="${linkFoto}" style="width:100%; display:block;" 
                                 onerror="this.src='https://hrj.com.ar/logo-hrj.png'; this.style.width='60%';">` : 
                                `<img src="https://hrj.com.ar/logo-hrj.png" style="width:60%; opacity:0.4;">`
                            }
                        </div>

                        <a href="${linkOriginal}" target="_blank" style="background:#000; color:#fff; padding:12px; text-decoration:none; border-radius:6px; font-size:13px; display:block; font-weight:bold;">VER FLYER COMPLETO</a>
                    </div>
                `, { maxWidth: 280 });
            }
        }
    }); 
</script>
    
</body>
