<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="https://hrj.com.ar/logo-hrj.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="canonical" href="https://hrj.com.ar/index.html">
    
    <title>Mapa Territorial | Haciendo Rap Juntxs</title>
    <meta name="description" content="Explorá el mapa territorial de Haciendo Rap Juntxs: el punto de encuentro entre el rap, los barrios del conurbano y la Universidad Nacional Arturo Jauretche.">
    <meta name="keywords" content="Haciendo Rap Juntxs, mapa, rap, conurbano, UNAJ, territorio, cultura">
    
    <meta property="og:title" content="Mapa Territorial | Haciendo Rap Juntxs">
    <meta property="og:description" content="Un recorrido visual por las voces del conurbano. Explorá el mapa de artistas y sedes de Haciendo Rap Juntxs.">
    <meta property="og:image" content="https://hrj.com.ar/logo-hrj.png">
    <meta property="og:url" content="https://hrj.com.ar/mapa-territorial.html">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; }

    :root { 
        --naranja: #ff4500; 
        --negro: #000; 
        --verde-agenda: #1fd655;
    }

    /* Contenedor principal de navegación */
    nav {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        gap: 10px;
        background: rgba(0, 0, 0, 0.85);
        padding: 10px;
        border: 1px solid var(--naranja);
        border-radius: 5px;
        backdrop-filter: blur(5px); /* Efecto esmerilado */
    }

    .btn-nav {
        font-family: 'Anton', sans-serif;
        color: #fff;
        text-decoration: none;
        font-size: 1rem;
        padding: 5px 15px;
        border: 2px solid transparent;
        transition: all 0.3s ease;
    }

    .btn-nav:hover {
        color: var(--negro);
        background-color: var(--naranja);
        border-color: var(--naranja);
    }

    /* Mapa a pantalla completa */
    #map { 
        height: 100vh; 
        width: 100vw; 
        position: absolute; 
        top: 0; 
        left: 0; 
        z-index: 1;
        background: #0d0d0d; /* Fondo base ultra oscuro antes de cargar las calles */
    }

    /* TEXTURA CALLEJERA DE ASFALTO OVERLAY */
    #map::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Crucial para que puedas seguir arrastrando el mapa sin trabas */
        z-index: 400; /* Se posiciona arriba de las calles pero abajo de los marcadores y popups */
        opacity: 0.12; /* Subido un toque para que en pantallas oscuras se note la textura de brea */
        background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
    } 

    /* Estilos de elementos sobre el mapa */
    .popup-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--naranja); }
    .marker-text { color: var(--naranja); font-weight: bold; text-align: center; font-family: 'Anton', sans-serif; }
    .custom-tooltip { background: rgba(0,0,0,0.85) !important; color: var(--naranja) !important; border: 1px solid var(--naranja) !important; font-family: 'Anton', sans-serif; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

    /* Personalización interna de los popups nativos de Leaflet para que combinen con la cartelera oscura */
    .leaflet-popup-content-wrapper {
        background: #111 !important;
        color: #fff !important;
        border-radius: 8px !important;
        padding: 0 !important;
        overflow: hidden;
    }
    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-popup-tip { background: #111 !important; }

    @media (max-width: 768px) {
        nav {
            top: auto;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            border-top: 2px solid var(--naranja);
            background: #000;
            border-radius: 0;
            padding: 5px;
            box-sizing: border-box;
        }
        .btn-nav {
            font-size: 0.6rem;
            padding: 8px 4px;
            flex: 1 1 30%;
            text-align: center;
            border: 1px solid var(--naranja);
            white-space: nowrap;
        }
        #map { height: 100vh; width: 100vw; }
    } 

    /* Botón de la Agenda Flotante */
    .agenda-promo {
        position: fixed;
        bottom: 80px; 
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        background: var(--verde-agenda);
        padding: 10px 20px;
        border-radius: 50px;
        font-family: 'Anton', sans-serif;
        box-shadow: 0 6px 20px rgba(0,0,0,0.7);
        border: 2px solid #fff;
        letter-spacing: 0.5px;
    }
    .agenda-promo p { margin: 0; font-size: 14px; color: #000; }
    .agenda-promo a { color: #000; text-decoration: underline; font-weight: bold; }

    /* El Punto Verde estilo Agenda Activa */
    .pulse-green {
        background: var(--verde-agenda);
        border-radius: 50%;
        border: 2px solid white;
        animation: pulse-green-animation 2s infinite;
    }
    @keyframes pulse-green-animation {
        0% { box-shadow: 0 0 0 0 rgba(31, 214, 85, 0.7); }
        70% { box-shadow: 0 0 0 12px rgba(31, 214, 85, 0); }
        100% { box-shadow: 0 0 0 0 rgba(31, 214, 85, 0); }
    } 


        /* El punto gris para eventos que ya pasaron */
.pulse-past {
    background: #555; /* Gris oscuro */
    border-radius: 50%;
    border: 1px solid #888;
    opacity: 0.6; /* Un poco transparente para que no distraiga */
} 

        
</style> 
</head>
<body>

<nav>
    <a href="index.html" class="btn-nav">INICIO</a>
    <a href="biografias.html" class="btn-nav">BIOGRAFÍAS</a>
    <a href="discografia.html" class="btn-nav">DISCOGRAFÍA</a>
    <a href="staff.html" class="btn-nav">STAFF</a>
    <a href="medios.html" class="btn-nav">PRENSA</a>
    <a href="contacto.html" class="btn-nav">CONTACTO</a>
</nav>

<div class="agenda-promo">
    <p>¿Tenés un evento? Subilo <a href="https://docs.google.com/forms/d/e/1FAIpQLSc8kjFM9Pg1SqjkHXsJjLA_eF_4itxfDL4_josRkLXTc_RhGQ/viewform?usp=sharing&ouid=112545650355580882446" target="_blank">a la Agenda Territorial</a></p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    var map = L.map('map').setView([-34.75, -58.55], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
}).addTo(map);
    L.control.locate().addTo(map);

    var unajCoords = [-34.7751535, -58.2678955]; 
    var unajMarker = L.marker(unajCoords, {title: "UNAJ - Av. Calchaquí 6200"}).addTo(map);
    unajMarker.bindPopup("<b>UNAJ - Sede Central</b><br>Av. Calchaquí 6200, Florencio Varela");

    var layerLazos = L.layerGroup().addTo(map);

    fetch('artistas.json')
        .then(res => res.json())
        .then(artistas => {
            var markersCluster = L.markerClusterGroup();
            artistas.forEach(a => {
                var marker = L.marker([a.lat, a.lng], {title: a.nombre});
                marker.bindTooltip(a.barrio, {permanent: true, className: 'custom-tooltip'});
                marker.bindPopup(`<div class="marker-text">${a.nombre}<br><a href="${a.url}"><img src="${a.img}" class="popup-img"></a></div>`);
                marker.on('click', function() {
                    layerLazos.clearLayers(); 
                    L.polyline([unajCoords, [a.lat, a.lng]], {
                        color: '#ff4500', weight: 4, opacity: 0.7, dashArray: '10, 10'
                    }).addTo(layerLazos);
                });
                markersCluster.addLayer(marker);
            });
            map.addLayer(markersCluster);
            map.addControl(new L.Control.Search({layer: markersCluster, propertyName: 'title', marker: false}));
        });

// --- MOTOR DE AGENDA CON HISTÓRICO Y CORRECCIÓN DE COLUMNAS ---
const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRDb66cxjNWqp62AMf2HvWlBndeut6aXVi_cRhqKDO5Xp6DnZFtmWA2ubKoR0PITD2ydDxRz-VMmi9o/pub?gid=2141097724&single=true&output=csv';

fetch(urlCSV)
    .then(res => res.text())
    .then(csvText => {
        const lineas = csvText.split('\n');

        for (let i = 1; i < lineas.length; i++) {
            const c = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
            if (c.length < 14) continue; 

            const nombre = c[1] ? c[1].replace(/"/g, "").trim() : "Evento";
            const fechaTexto = c[5] ? c[5].replace(/"/g, "").trim() : ""; 
            const linkInstagram = c[6] ? c[6].replace(/"/g, "").trim() : "#";
            const lat = parseFloat(c[12] ? c[12].replace(/[ "]/g, "").replace(',', '.') : NaN);
            const lng = parseFloat(c[13] ? c[13].replace(/[ "]/g, "").replace(',', '.') : NaN);
            const estado = c[14] ? c[14].replace(/"/g, "").trim().toUpperCase() : "";

            if (estado === "OK" && !isNaN(lat) && !isNaN(lng) && fechaTexto) {
                // LÓGICA DE FECHAS (ACTIVO VS ARCHIVO)
                const partesFecha = fechaTexto.split(/[-/]/);
                let fechaEvento;
                if (partesFecha[0].length === 4) { 
                    fechaEvento = new Date(partesFecha[0], partesFecha[1] - 1, partesFecha[2]);
                } else { 
                    fechaEvento = new Date(partesFecha[2], partesFecha[1] - 1, partesFecha[0]);
                }

                const hoy = new Date();
                const fechaVencimiento = new Date(fechaEvento);
                fechaVencimiento.setDate(fechaVencimiento.getDate() + 2);

                let claseIcono = 'pulse-green';
                let etiqueta = 'EVENTO ACTIVO';
                let colorBorde = '#1fd655';

                if (hoy > fechaVencimiento) {
                    claseIcono = 'pulse-past'; // Asegurate de tener este estilo en tu CSS
                    etiqueta = 'ARCHIVO TERRITORIAL';
                    colorBorde = '#555';
                }

                const nombreArchivo = nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^\w-]/g, '');
                const rutaFlyer = `./flyer-territorial/${nombreArchivo}.jpg?v=${new Date().getTime()}`;

                L.marker([lat, lng], {
                    icon: L.divIcon({ className: claseIcono, iconSize: [20, 20], iconAnchor: [10, 10] })
                }).addTo(map).bindPopup(`
                    <div style="text-align: center; font-family: 'Anton', sans-serif; width: 230px; background: #111; color: #fff; padding: 15px; border-radius: 8px; border: 1px solid ${colorBorde};">
                        <div style="font-size: 10px; color: ${colorBorde}; margin-bottom: 5px; letter-spacing:1px;">${etiqueta}</div>
                        <div style="overflow: hidden; border-radius: 6px; margin-bottom: 12px; background: #000;">
                            <img src="${rutaFlyer}" onerror="this.style.display='none'" style="width: 100%; border-bottom: 3px solid ${colorBorde};">
                        </div>
                        <h2 style="margin: 0 0 8px 0; font-size: 18px; text-transform: uppercase;">${nombre}</h2>
                        <div style="font-family: 'Courier Prime', monospace; font-size: 12px; margin-bottom: 15px; color: ${colorBorde}; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 4px; display: inline-block;">
                            📅 ${fechaTexto}
                        </div>
                        <a href="${linkInstagram}" target="_blank" style="display: block; background: ${colorBorde}; color: #000; padding: 10px; text-decoration: none; font-weight: bold; border-radius: 5px; font-size: 13px; text-transform: uppercase;">INFO</a>
                    </div>
                `);
            }
        }
    });

// --- MOTOR DE CARGA FILTRADO: ESTUDIOS UNDER (AMBA) ---
fetch('estudios.geojson')
    .then(res => res.json())
    .then(data => {
        // Filtro Anti-Mainstream
        const mainstream = ["DISNEY", "TELEFE", "CANAL", "MITRE", "ESTUDIOS MAYOR", "AMERICA TV", "C5N"];

        data.features.forEach(feature => {
            let coords;
            if (feature.geometry.type === 'Polygon') {
                const lats = feature.geometry.coordinates[0].map(c => c[1]);
                const lngs = feature.geometry.coordinates[0].map(c => c[0]);
                coords = [(Math.min(...lats) + Math.max(...lats)) / 2, (Math.min(...lngs) + Math.max(...lngs)) / 2];
            } else {
                coords = [feature.geometry.coordinates[1], feature.geometry.coordinates[0]];
            }

            const nombre = (feature.properties.name || "Estudio").toUpperCase();
            const esMainstream = mainstream.some(palabra => nombre.includes(palabra));
            const lat = coords[0];
            const lng = coords[1];
            const dentroDeRango = (lat < -34.35 && lat > -35.05) && (lng < -57.80 && lng > -59.10);

            if (dentroDeRango && !esMainstream) {
                L.circleMarker(coords, {
                    radius: 5,
                    fillColor: '#8a2be2', 
                    color: '#ffffff',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.7
                }).addTo(map).bindPopup(`
                    <div style="text-align: center; font-family: 'Anton', sans-serif; background: #111; color: #fff; padding: 10px; border-radius: 8px; border: 1px solid #8a2be2;">
                        <div style="font-size: 9px; color: #8a2be2; letter-spacing: 1px;">🎙️ ESPACIO UNDER</div>
                        <div style="font-size: 14px;">${nombre}</div>
                    </div>
                `);
            }
        });
    }); 

// --- MOTOR DE CARGA FILTRADO: AMBA Y CAPITAL ---
fetch('estudios.geojson')
    .then(res => res.json())
    .then(data => {
        data.features.forEach(feature => {
            let coords;
            
            // Gestión de geometría: Polígonos a Puntos
            if (feature.geometry.type === 'Polygon') {
                const lats = feature.geometry.coordinates[0].map(c => c[1]);
                const lngs = feature.geometry.coordinates[0].map(c => c[0]);
                const centerLat = (Math.min(...lats) + Math.max(...lats)) / 2;
                const centerLng = (Math.min(...lngs) + Math.max(...lngs)) / 2;
                coords = [centerLat, centerLng];
            } else if (feature.geometry.type === 'Point') {
                coords = [feature.geometry.coordinates[1], feature.geometry.coordinates[0]];
            }

            if (coords) {
                const lat = coords[0];
                const lng = coords[1];

                // FILTRO TERRITORIAL ESTRICTO (ZONA NORTE, SUR, OESTE Y CABA)
                // Latitudes: Entre Tigre/Pilar y La Plata
                // Longitudes: Entre el Río y Luján/Rodríguez
                const dentroDeRango = (lat < -34.35 && lat > -35.05) && (lng < -57.80 && lng > -59.10);

                if (dentroDeRango) {
                    const nombre = feature.properties.name || "Estudio de Grabación";
                    const tipo = feature.properties.studio || "Audio";

                    L.circleMarker(coords, {
                        radius: 6,
                        fillColor: '#8a2be2', 
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map).bindPopup(`
                        <div style="text-align: center; font-family: 'Anton', sans-serif; background: #111; color: #fff; padding: 10px; border-radius: 8px; border: 1px solid #8a2be2; min-width: 150px;">
                            <div style="font-size: 9px; color: #8a2be2; letter-spacing: 1px; margin-bottom: 3px;">🎙️ INFRAESTRUCTURA</div>
                            <div style="font-size: 14px; text-transform: uppercase;">${nombre}</div>
                            <div style="font-family: 'Courier Prime', monospace; font-size: 11px; color: #aaa; margin-top: 5px;">
                                ${tipo.toUpperCase()}
                            </div>
                        </div>
                    `);
                }
            }
        });
    })
    .catch(err => console.error("Error al cargar estudios.geojson", err)); 
    
</script>
    
</body>
</html>
