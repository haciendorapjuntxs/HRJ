    <style>

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; }

            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid var(--naranja);
            border-radius: 5px;
        }

        .btn-nav {
            font-family: 'Anton', sans-serif;

            text-decoration: none;
            font-size: 1rem;
            padding: 5px 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .btn-nav:hover {
            color: var(--negro);
            background-color: var(--naranja);
            border-color: var(--naranja);
        }

        /* Mapa a pantalla completa */
        #map { 
            height: 100vh; 
            width: 100vw; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1;
        }

        .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(80%) contrast(100%); }
        
        .popup-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--naranja); }

       /* Botón de la Agenda */

/* El Punto Verde estilo Instagram */
.pulse-green {
    background: #1fd655;
    border-radius: 50%;
    border: 2px solid white;
    animation: pulse-green-animation 2s infinite;
}
@keyframes pulse-green-animation {
    0% { box-shadow: 0 0 0 0 rgba(31, 214, 85, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(31, 214, 85, 0); }
    100% { box-shadow: 0 0 0 0 rgba(31, 214, 85, 0); }

<nav>

    <p>¿Tenés un evento? <a href="https://docs.google.com/forms/d/e/1FAIpQLSc8kjFM9Pg1SqjkHXsJjLA_eF_4itxfDL4_josRkLXTc_RhGQ/viewform?usp=sharing&ouid=112545650355580882446" target="_blank">Subilo a la Agenda Territorial</a></p>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    var map = L.map('map').setView([-34.75, -58.55], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.control.locate().addTo(map);

    var unajCoords = [-34.7751535, -58.2678955]; 
    
    var unajMarker = L.marker(unajCoords, {
        title: "UNAJ - Av. Calchaquí 6200"
    }).addTo(map);
    
    unajMarker.bindPopup("<b>UNAJ - Sede Central</b><br>Av. Calchaquí 6200, Florencio Varela");

    var layerLazos = L.layerGroup().addTo(map);

    fetch('artistas.json')
        .then(res => res.json())
        .then(artistas => {
            var markersCluster = L.markerClusterGroup();
            
            artistas.forEach(a => {
                var marker = L.marker([a.lat, a.lng], {title: a.nombre});
                marker.bindTooltip(a.barrio, {permanent: true, className: 'custom-tooltip'});
                marker.bindPopup(`<div class="marker-text">${a.nombre}<br><a href="${a.url}"><img src="${a.img}" class="popup-img"></a></div>`);
                
                marker.on('click', function() {
                    layerLazos.clearLayers(); 
                    L.polyline([unajCoords, [a.lat, a.lng]], {
                        color: '#ff4500',
                        weight: 4,
                        opacity: 0.7,
                        dashArray: '10, 10'
                    }).addTo(layerLazos);
                });

                markersCluster.addLayer(marker);
            });
            
            map.addLayer(markersCluster);
            map.addControl(new L.Control.Search({layer: markersCluster, propertyName: 'title', marker: false}));
        });


// --- MOTOR DE AGENDA CON VISTA DE FLYER ---
const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRDb66cxjNWqp62AMf2HvWlBndeut6aXVi_cRhqKDO5Xp6DnZFtmWA2ubKoR0PITD2ydDxRz-VMmi9o/pub?gid=2141097724&single=true&output=csv';

fetch(urlCSV)
    .then(res => res.text())
    .then(csvText => {
        const lineas = csvText.split('\n');
        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);

        for (let i = 1; i < lineas.length; i++) {
            const c = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
            if (c.length < 11) continue;

            const nombre = c[2] ? c[2].replace(/"/g, "").trim() : "Evento HRJ";
            const fechaRaw = c[6] ? c[6].replace(/"/g, "").trim() : ""; 
            const linkOriginal = c[8] ? c[8].replace(/"/g, "").trim() : "";
            
            // TRUCO: Convertimos el link de Drive para que sea una imagen visible
            let linkFoto = "";
            if(linkOriginal.includes("drive.google.com")) {
                const idMatch = linkOriginal.match(/\/d\/(.+?)\//);
                if(idMatch) {
                    linkFoto = `https://lh3.googleusercontent.com/u/0/d/${idMatch[1]}`;
                }
            }

            const lat = parseFloat(c[9].replace(/[ "]/g, "").replace(',', '.'));
            const lng = parseFloat(c[10].replace(/[ "]/g, "").replace(',', '.'));
            const estado = c[11] ? c[11].replace(/"/g, "").trim().toUpperCase() : "";

            if (estado === "OK" && !isNaN(lat)) {
                
                L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'pulse-green', iconSize: [18, 18] })
                }).addTo(map).bindPopup(`
                    <div style="text-align:center; font-family:'Anton'; width:220px;">
                        <div style="background:#1fd655; color:#000; padding:5px; font-size:12px; margin-bottom:10px;">AGENDA TERRITORIAL</div>
                        
                        <strong style="font-size:16px; display:block; margin-bottom:5px;">${nombre}</strong>
                        <span style="font-family:monospace; font-size:12px;">📅 ${fechaRaw}</span>
                        
                        <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
                        
                        ${linkFoto ? 
                            `<img src="${linkFoto}" style="width:100%; border-radius:5px; margin-bottom:10px; border:1px solid #ddd;" alt="Flyer">` : 
                            `<p style="font-size:10px; color:#666;">(Sin imagen disponible)</p>`
                        }

                        <a href="${linkOriginal}" target="_blank" style="background:#000; color:#fff; padding:8px; text-decoration:none; border-radius:4px; font-size:11px; display:block;">VER EN TAMAÑO COMPLETO</a>
                    </div>
                `, { maxWidth: 250 });
            }
        }
    }); 
</script>
