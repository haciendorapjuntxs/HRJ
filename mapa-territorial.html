<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa Territorial | Haciendo Rap Juntxs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: sans-serif; }
        #map { height: 75vh; width: 95%; margin: 80px auto 20px auto; border: 2px solid #f37021; }
        .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(80%) contrast(100%); }
        .popup-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #f37021; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .popup-img:hover { transform: scale(1.1); }
        .marker-text { color: #f37021; font-weight: bold; text-align: center; }
        .custom-tooltip { background: rgba(0, 0, 0, 0.8) !important; color: #f37021 !important; border: 1px solid #f37021 !important; font-weight: bold; border-radius: 5px; }
        .nav-banner { position: fixed; top: 0; left: 0; width: 100%; z-index: 2000; margin: 0; padding: 10px 0; background: #000; list-style: none; display: flex; justify-content: center; gap: 20px; border-bottom: 1px solid #f37021; }
        .nav-banner li a { color: #fff; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        .leaflet-control-search { z-index: 1000 !important; margin-top: 70px !important; }
    </style>
</head>
<body>

    <ul class="nav-banner">
        <li><a href="discografia.html">DISCOGRAFIA</a></li>
        <li><a href="staff.html">STAFF</a></li>
        <li><a href="medios.html">PRENSA</a></li>
        <li><a href="contacto.html">CONTACTO</a></li>
        <li><a href="experiencia.html">NUESTRO RECORRIDO</a></li>
        <li><a href="index.html">INICIO</a></li>
    </ul>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
    <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        var map = L.map('map').setView([-34.75, -58.55], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        L.control.locate({strings: {title: "Mi ubicación"}}).addTo(map);

        fetch('artistas.json')
            .then(response => response.json())
            .then(artistas => {
                // El Cluster principal
                var markersCluster = L.markerClusterGroup();
                
                artistas.forEach(a => {
                    var marker = L.marker([a.lat, a.lng], {title: a.nombre});
                    
                    marker.bindTooltip(`<b>${a.barrio}</b>`, { permanent: true, direction: 'top', className: 'custom-tooltip' });
                    marker.bindPopup(`
                        <div class="marker-text">
                            ${a.nombre}<br>
                            <a href="${a.url}"><img src="${a.img}" class="popup-img" alt="${a.nombre}"></a>
                        </div>
                    `);

                    markersCluster.addLayer(marker);
                });

                map.addLayer(markersCluster);

                // Buscador (ahora busca dentro del cluster)
                var searchControl = new L.Control.Search({
                    layer: markersCluster,
                    propertyName: 'title',
                    marker: false,
                    moveToLocation: function(latlng, title, map) { 
                        map.setView(latlng, 15);
                        markersCluster.zoomToShowLayer(latlng, function() { marker.openPopup(); }); 
                    }
                });
                map.addControl(searchControl);
            });
    </script>
</body>
</html>
