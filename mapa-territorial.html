<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// 1. CONFIGURACIÓN BASE
var map = L.map('map').setView([-34.75, -58.55], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    subdomains: 'abcd',
    maxZoom: 20
}).addTo(map);

L.control.locate().addTo(map);

// GRUPO INTELIGENTE PARA DISPERSAR EVENTOS EN LA UNAJ (Estilo esferas del dragón)
const grupoClustering = L.markerClusterGroup({
    spiderfyOnMaxZoom: true, // Abre en abanico los marcadores que coinciden en el mismo punto
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true
});
map.addLayer(grupoClustering); 

// 2. SEDE UNAJ
var unajCoords = [-34.7751535, -58.2678955]; 
var unajMarker = L.marker(unajCoords, {title: "UNAJ"}).addTo(map);
unajMarker.bindPopup("<b>UNAJ - Sede Central</b><br>Florencio Varela");

var layerLazos = L.layerGroup().addTo(map);

// 3. MOTOR DE ARTISTAS
fetch('artistas.json')
    .then(res => res.json())
    .then(artistas => {
        var markersCluster = L.markerClusterGroup();
        artistas.forEach(a => {
            var marker = L.marker([a.lat, a.lng], {title: a.nombre});
            marker.bindTooltip(a.barrio, {permanent: true, className: 'custom-tooltip'});
            marker.bindPopup(`<div class="marker-text">${a.nombre}<br><a href="${a.url}"><img src="${a.img}" class="popup-img"></a></div>`);
            marker.on('click', function() {
                layerLazos.clearLayers(); 
                L.polyline([unajCoords, [a.lat, a.lng]], {
                    color: '#ff4500', weight: 4, opacity: 0.7, dashArray: '10, 10'
                }).addTo(layerLazos);
            });
            markersCluster.addLayer(marker);
        });
        map.addLayer(markersCluster);
        map.addControl(new L.Control.Search({layer: markersCluster, propertyName: 'title', marker: false}));
    });

// --- 4. MOTOR DE AGENDA (RUTAS DE DRIVE REPARADAS) ---
const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRDb66cxjNWqp62AMf2HvWlBndeut6aXVi_cRhqKDO5Xp6DnZFtmWA2ubKoR0PITD2ydDxRz-VMmi9o/pub?gid=2141097724&single=true&output=csv&cb=' + new Date().getTime();
const urlHistoricoCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRQ0u1VMMDvmJoLzbMXe7as01c2QPPNyFXaB_KRGSAZOxpDBVWAkMD_fHsIOSmO2AvWaoJ57gGIbFzM/pub?output=csv&cb=' + new Date().getTime();

const capaPasados = L.layerGroup(); 

// Función reutilizable para procesar filas de CSV de Sheets de forma unificada
function procesarHojaCSV(url, esCapaHistoricaFija) {
    fetch(url)
        .then(res => res.text())
        .then(csvText => {
            const lineas = csvText.split('\n');
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0); 

            for (let i = 1; i < lineas.length; i++) {
                const c = lineas[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                if (!c || c.length < 11) continue; 

                const estado = c[10] ? c[10].toUpperCase().trim() : "";
                if (!estado.includes("OK")) continue;

                const lat = parseFloat(c[8]?.replace(/[ "]/g, "").replace(',', '.'));
                const lng = parseFloat(c[9]?.replace(/[ "]/g, "").replace(',', '.'));
                if (isNaN(lat) || isNaN(lng)) continue;

                const nombre = c[1] ? c[1].replace(/"/g, "").trim() : "Evento";
                const datoFlyer = c[2] ? c[2].replace(/"/g, "").trim() : "";
                const fechaTxt = c[5]?.trim() || ""; 
                const linkFB = c[6] ? c[6].replace(/"/g, "").trim() : "#";

                // Procesador de Fecha Argentina (D/M/AAAA) o ISO (AAAA-MM-DD)
                const partes = fechaTxt.split(/[-/]/); 
                if (partes.length !== 3) continue;

                let dia, mes, anio;
                if (partes[0].length === 4) { 
                    anio = partes[0];
                    mes = partes[1].padStart(2, '0');
                    dia = partes[2].padStart(2, '0');
                } else { 
                    dia = partes[0].padStart(2, '0');
                    mes = partes[1].padStart(2, '0');
                    anio = partes[2];
                }

                let fEv = new Date(`${anio}-${mes}-${dia}T23:59:59`);
                if (isNaN(fEv.getTime())) continue; 

                // Forzamos comportamiento pasado/blanco-negro si pertenece al Sheet Histórico curado
                const esPasado = esCapaHistoricaFija ? true : (hoy > fEv);
                const colorTema = esPasado ? '#888' : '#1fd655';

                // REPARACIÓN DEFINITIVA DE LÓGICA HÍBRIDA (Local / Servidor Drive / Forzado Histórico)
                let urlFinalImg = "https://hrj.com.ar/logo-hrj.png";
                
                if (esCapaHistoricaFija) {
                    urlFinalImg = `./flyer-territorial/archivo-historico-del-hip-hop.jpg`;
                } else if (datoFlyer.includes('drive.google.com') || datoFlyer.includes('id=')) {
                    let idImg = "";
                    if (datoFlyer.includes('id=')) {
                        idImg = datoFlyer.split('id=')[1].split('&')[0];
                    } else if (datoFlyer.includes('/d/')) {
                        idImg = datoFlyer.split('/d/')[1].split('/')[0];
                    }
                    urlFinalImg = `https://lh3.googleusercontent.com/d/${idImg}`;
                } else if (datoFlyer.length > 3) {
                    urlFinalImg = (datoFlyer.includes('/') || datoFlyer.startsWith('http')) ? 
                                  datoFlyer : `./flyer-territorial/${datoFlyer}`;
                }

                const marcador = L.marker([lat, lng], {
                    icon: L.divIcon({ 
                        className: esPasado ? 'pulse-past' : 'pulse-green', 
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    })
                }).bindPopup(`
                    <div style="text-align: center; font-family: 'Anton', sans-serif; width: 220px; background: #111; color: #fff; padding: 10px; border-radius: 8px; border: 1px solid ${colorTema};">
                        <div style="overflow: hidden; border-radius: 4px; margin-bottom: 8px; background: #000; filter: ${esPasado ? 'grayscale(1)' : 'none'}; -webkit-filter: ${esPasado ? 'grayscale(1)' : 'none'};">
                            <img src="${urlFinalImg}" onerror="this.src='https://hrj.com.ar/logo-hrj.png'" style="width: 100%; display: block; object-fit: cover; min-height: 100px;">
                        </div>
                        <h3 style="margin: 5px 0; font-size: 16px; text-transform: uppercase;">${nombre}</h3>
                        <p style="font-family: 'Courier Prime'; font-size: 12px; color: ${colorTema}; margin: 5px 0 10px 0;">📅 ${fechaTxt}</p>
                        <a href="${linkFB}" target="_blank" style="display: block; background: ${colorTema}; color: #000; padding: 8px; text-decoration: none; font-weight: bold; border-radius: 4px; font-size: 11px; text-transform: uppercase;">MÁS INFO</a>
                    </div>
                `, { maxWidth: 250 });

                if (esPasado) {
                    marcador.addTo(grupoClustering); 
                    capaPasados.addLayer(marcador); 
                } else {
                    marcador.addTo(grupoClustering);
                } 
            }
        });
}

// Inicializamos la carga de ambas hojas en simultáneo
procesarHojaCSV(urlCSV, false);
procesarHojaCSV(urlHistoricoCSV, true);

// 5. FUNCIÓN DEL BOTÓN HISTORIAL (Control de clústeres optimizado)
function toggleEventosPasados(e) {
    e.preventDefault();
    const btn = document.getElementById('toggle-pasados'); 
    
    if (grupoClustering.hasLayer(capaPasados.getLayers()[0])) {    
        capaPasados.eachLayer(function(layer) {
            grupoClustering.removeLayer(layer);
        });
        btn.innerText = "HISTORIAL";
        btn.classList.remove('activo');
    } else {
        capaPasados.eachLayer(function(layer) {
            grupoClustering.addLayer(layer);
        });       
        btn.innerText = "OCULTAR PASADOS";
        btn.classList.add('activo');
    }
} 
    
// 6. MOTOR DE ESTUDIOS
fetch('estudios.geojson')
    .then(res => res.json())
    .then(data => {
        const mainstream = ["DISNEY", "TELEFE", "CANAL", "MITRE", "ESTUDIOS MAYOR", "AMERICA TV", "C5N"];
        data.features.forEach(f => {
            let coords;
            if (f.geometry.type === 'Polygon') {
                const lats = f.geometry.coordinates[0].map(c => c[1]);
                const lngs = f.geometry.coordinates[0].map(c => c[0]);
                coords = [(Math.min(...lats) + Math.max(...lats)) / 2, (Math.min(...lngs) + Math.max(...lngs)) / 2];
            } else {
                coords = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
            }
            
            const nombre = (f.properties.name || "Estudio").toUpperCase();
            if (!mainstream.some(p => nombre.includes(p)) && coords[0] < -34.35 && coords[0] > -35.05) {
                L.circleMarker(coords, { radius: 5, fillColor: '#8a2be2', color: '#fff', weight: 1, fillOpacity: 0.7 }).addTo(map)
                .bindPopup(`<div style="font-family:'Anton'; text-align:center; font-size:12px;">🎙️ ${nombre}</div>`);
            }
        });
    });
</script>
</body>
</html>
